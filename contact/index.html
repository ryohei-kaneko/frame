<main class="main-content">

  <p class="page-label">Contact</p>

  <div class="contact-lead">
    <p>For project enquiries, please fill in the form below.</p>
    <p class="ja">お仕事のご依頼・ご相談はフォームよりお気軽にどうぞ。</p>
    <p class="ja">制作内容が決まっていない段階でもご相談ください。<br>写真、動画、Webの中から、目的に合わせて必要な形をご提案します。</p>
  </div>

  <!--
    REPLACE: action の YOUR_FORM_ID を Formspree のフォーム ID に変更してください。
    Formspree (https://formspree.io) でフォームを作成すると
    「https://formspree.io/f/xxxxxxxx」のような URL が発行されます。
  -->
  <form
    class="contact-form"
    action="https://formspree.io/f/YOUR_FORM_ID"
    method="POST"
  >
    <!-- スパム対策ハニーポット（非表示） -->
    <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">

    <div class="form-row">
      <div class="form-field">
        <label for="name">Name / お名前 <span aria-hidden="true">*</span></label>
        <input type="text" id="name" name="name" autocomplete="name" required>
      </div>
      <div class="form-field">
        <label for="company">Company / 会社名</label>
        <input type="text" id="company" name="company" autocomplete="organization">
      </div>
    </div>

    <div class="form-field">
      <label for="email">Email / メールアドレス <span aria-hidden="true">*</span></label>
      <input type="email" id="email" name="email" autocomplete="email" required>
    </div>

    <div class="form-field">
      <label for="service">Service / ご依頼の種類 <span aria-hidden="true">*</span></label>
      <div class="select-wrap">
        <select id="service" name="service" required>
          <option value="" disabled selected>選択してください / Please select</option>
          <option value="photo">スチール撮影・編集 / Still Photography</option>
          <option value="video">動画撮影・編集 / Video Production</option>
          <option value="web">LP・ウェブサイト制作 / LP & Website</option>
          <option value="other">その他 / Other</option>
        </select>
      </div>
    </div>

    <div class="form-field">
      <label for="message">Message / メッセージ <span aria-hidden="true">*</span></label>
      <textarea id="message" name="message" rows="6" required></textarea>
    </div>

    <button type="submit" class="form-submit">Send</button>

  </form>

</main>

<script src="../main.js"></script>
